<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#141414"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="#222222" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="#222222" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Keychain / Pendant silhouette -->
  <g stroke="#f5f5f5" stroke-width="2" fill="none" opacity="0.4" transform="translate(230, 150)">
    <circle cx="70" cy="50" r="35"/>
    <line x1="70" y1="85" x2="70" y2="130" stroke="#f5f5f5" stroke-width="3"/>
    <!-- Fallen angel mask tag -->
    <rect x="25" y="130" width="90" height="130" rx="2" stroke="#f5f5f5" stroke-width="2"/>
    <line x1="40" y1="170" x2="100" y2="170" stroke="#d6001c" stroke-width="2"/>
    <circle cx="50" cy="190" r="4" fill="#f5f5f5"/>
    <circle cx="90" cy="190" r="4" fill="#f5f5f5"/>
  </g>
  <!-- Framing marks -->
  <path d="M 40 60 L 40 40 L 60 40" stroke="#d6001c" stroke-width="2" fill="none"/>
  <path d="M 540 40 L 560 40 L 560 60" stroke="#d6001c" stroke-width="2" fill="none"/>
  <path d="M 40 540 L 40 560 L 60 560" stroke="#d6001c" stroke-width="2" fill="none"/>
  <path d="M 540 560 L 560 560 L 560 540" stroke="#d6001c" stroke-width="2" fill="none"/>
  <!-- Badge & Typography -->
  <rect x="210" y="460" width="180" height="26" fill="#d6001c" rx="1"/>
  <text x="300" y="477" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">EN PRODUCCIÓN</text>
  <text x="300" y="520" fill="#8e8e93" font-family="'Space Grotesk', sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">ACCESORIOS ESH [PROTOTIPO]</text>
</svg>
